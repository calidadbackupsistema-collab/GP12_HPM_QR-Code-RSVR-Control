<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>GP12 Validación de Códigos QR | HPM</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --n: #102a43;
            --b: #1769aa;
            --r: #c62828;
            --g: #168447;
            --bg: #edf2f7
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            font-family: Arial, "Noto Sans KR", sans-serif;
            color: #172033
        }

        header {
            background: linear-gradient(120deg, #0b2239, #1769aa);
            color: #fff;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            gap: 16px
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .logo {
            width: 47px;
            height: 47px;
            border-radius: 50%;
            background: white;
            color: var(--b);
            display: grid;
            place-items: center;
            font-weight: 900
        }

        .brand h1 {
            font-size: 20px;
            margin: 0
        }

        .brand p {
            font-size: 12px;
            margin: 4px 0;
            color: #dbeafe
        }

        .langs {
            display: flex;
            gap: 5px
        }

        .langs button {
            border: 1px solid #ffffff66;
            background: #ffffff18;
            color: white;
            border-radius: 7px;
            padding: 8px
        }

        .langs .on {
            background: white;
            color: var(--n)
        }

        main {
            max-width: 850px;
            margin: 20px auto;
            padding: 0 15px
        }

        .card,
        .result {
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 19px;
            margin-bottom: 15px;
            box-shadow: 0 5px 18px #18324a12
        }

        h2 {
            font-size: 17px;
            margin: 0 0 14px;
            color: var(--n)
        }

        .grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 13px
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #475569;
            margin-bottom: 6px
        }

        select,
        input {
            width: 100%;
            height: 46px;
            border: 1px solid #b9c5d2;
            border-radius: 8px;
            padding: 0 12px;
            font-size: 15px;
            background: white
        }

        input[readonly] {
            background: #f1f5f9;
            font-weight: bold
        }

        .scan {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 9px
        }

        .btn {
            height: 46px;
            border: 0;
            border-radius: 8px;
            padding: 0 17px;
            font-weight: bold;
            cursor: pointer
        }

        .primary {
            background: var(--b);
            color: #fff
        }

        .secondary {
            background: #e2e8f0;
            color: var(--n)
        }

        .danger {
            height: 33px;
            background: #fee2e2;
            color: #991b1b
        }

        .hint {
            font-size: 12px;
            color: #64748b
        }

        .result {
            display: none;
            text-align: center
        }

        .result.show {
            display: block
        }

        .result.ok {
            background: #e7f7ed;
            border: 2px solid var(--g);
            color: #116436
        }

        .result.ng {
            background: #fff0f0;
            border: 2px solid var(--r);
            color: #9e1b1b
        }

        .icon {
            font-size: 36px;
            font-weight: 900
        }

        .result h3 {
            margin: 4px;
            font-size: 22px
        }

        .checks {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 13px
        }

        .check {
            background: #ffffffb8;
            padding: 9px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: bold
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px
        }

        .count {
            font-size: 11px;
            color: #64748b
        }

        .table {
            overflow: auto;
            margin-top: 12px
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px
        }

        th,
        td {
            padding: 9px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
            white-space: nowrap
        }

        th {
            background: #f1f5f9
        }

        .yes {
            color: var(--g);
            font-weight: bold
        }

        .no {
            color: var(--r);
            font-weight: bold
        }

        dialog {
            border: 0;
            border-radius: 12px;
            padding: 0;
            width: min(600px, 94%)
        }

        dialog::backdrop {
            background: #061525cc
        }

        .mh {
            background: var(--n);
            color: white;
            padding: 13px;
            display: flex;
            justify-content: space-between
        }

        .mh button {
            background: none;
            border: 0;
            color: #fff;
            font-size: 23px
        }

        .mb {
            background: #08131d;
            padding: 12px;
            text-align: center;
            color: white
        }

        video {
            width: 100%;
            min-height: 260px;
            background: #000
        }

        footer {
            text-align: center;
            color: #64748b;
            font-size: 11px;
            padding: 5px 10px 22px
        }

        @media(max-width:620px) {
            header {
                flex-direction: column
            }

            .grid,
            .scan,
            .checks {
                grid-template-columns: 1fr
            }

            .langs button {
                flex: 1
            }

            .langs {
                width: 100%
            }
        }
    </style>
</head>

            </div>
            <div id="sessionView" hidden>

                    <div class="session-actions"><button id="adminBtn" class="btn secondary" hidden>Administrar personal</button><button id="reportBtn" class="btn primary" hidden>Reporte</button><button id="logoutBtn" class="link-btn">Cerrar sesión</button></div>
                </div>
            </div>
        </section>
        <section id="programCard" class="card stage" hidden>
            <h2 data-t="s1"></h2>
            <div class="grid">

                    </select></div>
                <div><label data-t="expected"></label><input id="part" readonly placeholder="—"></div>
            </div>
        </section>
        <section id="scanCard" class="card stage" hidden>

            <div class="scan"><input id="qr" data-ph="placeholder" autocomplete="off"><button id="camera" class="btn secondary" data-t="camera"></button></div>

        </section>
        <section id="result" class="result">

                <div class="check" id="c2"></div>
                <div class="check" id="c3"></div>
            </div>
        </section>
        <section id="historyCard" class="card stage" hidden>

                <h2 style="margin:0" data-t="history"></h2>
                <div><span id="count" class="count"></span> <button id="clear" class="btn danger" data-t="clear"></button></div>
            </div>
            <div class="table">

                    <thead>
                        <tr>

                $('cloudStatus').textContent = 'Firebase sin acceso: revise las reglas de la base de datos';
                $('cloudStatus').className = 'cloud-note cloud-off'
            } else {
                $('cloudStatus').textContent = 'Firebase conectado';
                $('cloudStatus').className = 'cloud-note cloud-ok'
            }
        }
        async function syncCloud() {
            if (!FIREBASE_DB_URL) {
                updateCloudStatus();
                return
            }
            cloudHadError = false;
            const u = await cloud('/users');
            if (Array.isArray(u) && u.length) localStorage.setItem(UK, JSON.stringify(u));
            else if (!cloudHadError) await cloudPut('/users', getUsers());
            const r = await cloud('/records');
            if (r && typeof r === 'object') {
                const merged = [...Object.values(r), ...get()];
                const seen = new Set();
                save(merged.filter(x => {
                    const k = x.date + '|' + x.code;
                    if (seen.has(k)) return false;
                    seen.add(k);
                    return true
                }).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 1000))
            }
            updateCloudStatus();
            render()
        }

        function showStage(id, on = true) {
            $(id).hidden = !on
        }
        function applySession(u) {
            currentUser = u;
            $('loginView').hidden = true;
            $('sessionView').hidden = false;
            $('sessionName').textContent = u.name + ' · ' + u.id;
            $('adminBtn').hidden = !u.admin;
            $('reportBtn').hidden = !u.admin;
            showStage('programCard');
            try {
                sessionStorage.setItem(SK, JSON.stringify({
                    id: u.id,
                    admin: !!u.admin
                }))
            } catch {}
        }

        function saveSessionProgram() {
            if (!currentUser) return;
            try {
                const saved = JSON.parse(sessionStorage.getItem(SK) || '{}');
                saved.id = currentUser.id;
                saved.admin = !!currentUser.admin;
                saved.program = $('program').value;
                sessionStorage.setItem(SK, JSON.stringify(saved))
            } catch {}
        }

        function clearSession() {
            try {
                sessionStorage.removeItem(SK)
            } catch {}
        }

        async function restoreSession() {
            let saved;
            try {
                saved = JSON.parse(sessionStorage.getItem(SK) || 'null')
            } catch {
                saved = null
            }
            if (!saved || !saved.id) return false;
            let u;
            if (saved.admin && saved.id === '3508') u = {
                id: '3508',
                name: 'Administrador',
                admin: true
            };
            else u = getUsers().find(x => x.active && x.id === saved.id);
            if (!u) {
                clearSession();
                return false
            }
            applySession(u);
            if (saved.program !== undefined && saved.program !== '' && P[+saved.program]) {
                $('program').value = saved.program;
                $('program').dispatchEvent(new Event('change'))
            }
            await syncCloud();
            return true
        }
        async function login() {
            const h = await sha($('accessPin').value.trim());
            let u;
            if (h === MASTER_HASH) u = {
                id: '3508',
                name: 'Administrador',
                admin: true
            };
            else u = getUsers().find(x => x.active && x.pinHash === h);
            if (!u) {
                $('loginMsg').textContent = 'PIN incorrecto o usuario inactivo';
                $('accessPin').select();
                return
            }
            applySession(u);
            $('accessPin').value = '';
            $('loginMsg').textContent = '';
            $('program').focus();
            await syncCloud()
        }
        $('loginBtn').onclick = login;
        $('accessPin').onkeydown = e => {
            if (e.key === 'Enter') login()
        };
        $('logoutBtn').onclick = () => {
            currentUser = null;
            clearSession();
            $('loginView').hidden = false;
            $('sessionView').hidden = true;
            $('adminBtn').hidden = true;
            $('reportBtn').hidden = true;
            ['programCard', 'scanCard', 'historyCard'].forEach(x => showStage(x, false));
            $('result').className = 'result';
            $('program').value = '';
            $('part').value = '';
            $('accessPin').focus()
        };
        $('adminBtn').onclick = () => {
            $('adminDialog').showModal();
            if (currentUser?.admin) {
                $('masterStep').hidden = true;
                $('adminPanel').hidden = false;
                renderUsers();
                syncCloud()
            } else {
                $('masterStep').hidden = false;
                $('adminPanel').hidden = true;
                $('masterPin').focus()
            }
        };
        $('closeAdmin').onclick = () => $('adminDialog').close();
        $('masterBtn').onclick = async () => {
            if (await sha($('masterPin').value) !== MASTER_HASH) {
                alert('Clave maestra incorrecta');
                return
            }
            $('masterStep').hidden = true;
            $('adminPanel').hidden = false;
            $('masterPin').value = '';
            renderUsers();
            syncCloud()
        };

        function renderUsers() {
            const u = getUsers();
            $('userList').innerHTML = u.map((x, i) => `<div class="user-row"><span>${esc(x.id)}</span><span>${esc(x.name)}</span><button class="btn danger" onclick="removeUser(${i})">Quitar</button></div>`).join('')
        }
        window.removeUser = i => {
            const u = getUsers();
            if (!confirm('¿Quitar acceso a ' + u[i].name + '?')) return;
            u.splice(i, 1);
            saveUsers(u);
            renderUsers()
        };
        $('addUserBtn').onclick = async () => {
            const id = $('newEmployee').value.trim(),
                name = $('newName').value.trim(),
                pin = $('newPin').value.trim();
            if (!id || !name || pin.length < 4) return alert('Capture empleado, nombre y PIN de al menos 4 dígitos');
            const u = getUsers();
            if (u.some(x => x.id === id)) return alert('El número de empleado ya existe');
            const pinHash = await sha(pin);
            if (u.some(x => x.pinHash === pinHash)) return alert('Ese PIN ya está asignado');
            u.push({
                id,
                name,
                pinHash,
                active: true
            });
            saveUsers(u);
            ['newEmployee', 'newName', 'newPin'].forEach(x => $(x).value = '');
            renderUsers()
        };
        $('firebaseUrl').value = FIREBASE_DB_URL;
        $('saveFirebaseBtn').onclick = async () => {
            FIREBASE_DB_URL = $('firebaseUrl').value.trim().replace(/\/$/, '');
            if (!/^https:\/\/.+\.(firebaseio\.com|firebasedatabase\.app)$/.test(FIREBASE_DB_URL)) return alert('La URL de Firebase no tiene un formato válido');
            localStorage.setItem('hpm_firebase_url', FIREBASE_DB_URL);
            await syncCloud()
        };
        async function exportReport() {
            if (!currentUser?.admin) return alert('Acceso exclusivo para administrador');
            if (typeof XLSX === 'undefined') return alert('No fue posible cargar el generador de Excel. Revise la conexión a internet.');
            $('reportBtn').disabled = true;
            $('reportBtn').textContent = 'Generando…';
            try {
                cloudHadError = false;
                const remote = await cloud('/records');
                updateCloudStatus();
                let rows = remote && typeof remote === 'object' ? Object.values(remote) : get();
                if (!rows.length) return alert('No hay registros disponibles para generar el reporte.');
                rows.sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')));
                const detail = rows.map((r, i) => ({
                    'No.': i + 1,
                    'Fecha y hora': r.date ? new Date(r.date).toLocaleString('es-MX') : '',
                    'No. empleado': r.inspectorId || '',
                    'Inspector': r.inspector || '',
                    'Programa / Modelo': r.program || '',
                    'Número de parte': r.part || '',
                    'Código QR': r.code || '',
                    'Resultado': r.ok ? 'APROBADO' : 'RECHAZADO',
                    'Motivo': r.reason === 'pkyk' ? 'Pieza NG de PKYK' : r.reason === 'duplicate' ? 'Código repetido' : r.reason === 'wrong' ? 'Número de parte incorrecto' : r.reason || ''
                }));
                const approved = rows.filter(r => r.ok).length,
                    rejected = rows.length - approved,
                    pkyk = rows.filter(r => r.reason === 'pkyk').length,
                    duplicate = rows.filter(r => r.reason === 'duplicate').length,
                    wrong = rows.filter(r => r.reason === 'wrong').length;
                const summary = [
                    ['REPORTE GP12 — VALIDACIÓN DE CÓDIGOS QR'],
                    ['Fecha de generación', new Date().toLocaleString('es-MX')],
                    ['Generado por', currentUser.name],
                    ['Fuente', cloudHadError ? 'Respaldo local' : 'Firebase Realtime Database'],
                    [],
                    ['Indicador', 'Cantidad'],
                    ['Total de verificaciones', rows.length],
                    ['Aprobadas', approved],
                    ['Rechazadas', rejected],
                    ['Pieza NG de PKYK', pkyk],
                    ['Códigos repetidos', duplicate],
                    ['Número de parte incorrecto', wrong]
                ];
                const wb = XLSX.utils.book_new(),
                    wsSummary = XLSX.utils.aoa_to_sheet(summary),
                    wsDetail = XLSX.utils.json_to_sheet(detail);
                wsSummary['!cols'] = [{
                    wch: 34
                }, {
                    wch: 28
                }];
                wsDetail['!cols'] = [{
                    wch: 7
                }, {
                    wch: 22
                }, {
                    wch: 14
                }, {
                    wch: 24
                }, {
                    wch: 20
                }, {
                    wch: 18
                }, {
                    wch: 70
                }, {
                    wch: 14
                }, {
                    wch: 27
                }];
                XLSX.utils.book_append_sheet(wb, wsSummary, 'Resumen');
                XLSX.utils.book_append_sheet(wb, wsDetail, 'Registros');
                const d = new Date(),
                    stamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                XLSX.writeFile(wb, `Reporte_GP12_QR_${stamp}.xlsx`)
            } finally {
                $('reportBtn').disabled = false;
                $('reportBtn').textContent = 'Reporte'
            }
        }
        $('reportBtn').onclick = exportReport;
        P.forEach((x, i) => {
            let o = document.createElement('option');
            o.value = i;
            o.textContent = x.join(' — ');
            $('program').append(o)
        });

        function sel() {
            return $('program').value === '' ? null : P[+$('program').value]
        }
        $('program').onchange = () => {
            const ready = !!sel();
            $('part').value = sel()?.[1] || '';
            showStage('scanCard', ready);
            showStage('historyCard', ready);
            $('result').className = 'result';
            saveSessionProgram();
            if (ready) setTimeout(() => {
                $('qr').focus();
                $('qr').select()
            }, 80)
        };

        function setLang(l) {
            L = l;
            document.documentElement.lang = l;
            document.querySelectorAll('[data-t]').forEach(e => e.textContent = t(e.dataset.t));
            document.querySelectorAll('[data-ph]').forEach(e => e.placeholder = t(e.dataset.ph));
            document.querySelectorAll('[data-l]').forEach(e => e.classList.toggle('on', e.dataset.l === l));
            render()
        }
        document.querySelectorAll('[data-l]').forEach(e => e.onclick = () => setLang(e.dataset.l));

        function show(ok, msg, read, dup, part) {
            $('result').className = 'result show ' + (ok ? 'ok' : 'ng');
            $('icon').textContent = ok ? '✓' : '✕';
            $('resultTitle').textContent = t(ok ? 'approved' : 'rejected');
            $('resultText').textContent = t(msg);
            $('c1').textContent = (read ? '✓ ' : '✕ ') + t(read ? 'read' : 'unread');
            $('c2').textContent = (dup ? '✕ ' : '✓ ') + t(dup ? 'repeated' : 'unique');
            $('c3').textContent = (part ? '✓ ' : '✕ ') + t(part ? 'pc' : 'pw');
            $('result').scrollIntoView({
                behavior: 'smooth',
                block: 'center'
            })
        }
        async function verify() {
            let s = sel();
            if (!currentUser) return $('accessPin').focus();
            if (!s) return alert(t('select'));
            let raw = $('qr').value.trim(),
                read = raw.length >= 4;
            if (!read) {
                show(false, 'empty', false, false, false);
                $('qr').focus();
                return
            }
            let a = get(),
                key = await sha(norm(raw)),
                cloudDup = FIREBASE_DB_URL ? await cloud('/codes/' + key) : null,
                blocked = PKYK_NG.has(norm(raw)),
                dup = !!cloudDup || a.some(x => norm(x.code) === norm(raw)),
                part = norm(raw).includes(norm(s[1])),
                ok = !blocked && !dup && part,
                msg = blocked ? 'pkyk' : dup ? 'duplicate' : part ? 'correct' : 'wrong';
            if (msg !== 'wrong') {
                const rec = {
                    date: new Date().toISOString(),
                    inspectorId: currentUser.id,
                    inspector: currentUser.name,
                    program: s[0],
                    part: s[1],
                    code: raw,
                    ok,
                    reason: msg
                };
                a.unshift(rec);
                save(a.slice(0, 1000));
                if (FIREBASE_DB_URL) {
                    await cloudPost('/records', rec);
                    await cloudPut('/codes/' + key, {
                        date: rec.date,
                        inspectorId: rec.inspectorId,
                        ok: rec.ok
                    })
                }
            }
            show(ok, msg, true, dup, part);
            $('qr').value = '';
            render();
            setTimeout(() => $('qr').focus(), 50)
        }
        $('qr').onkeydown = e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                verify()
            }
        };
        const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        } [c]));

        function render() {
            let a = get();
            $('count').textContent = `${a.length} ${t('records')}`;
            $('rows').innerHTML = a.length ? a.map(x => {
                const code = x.code || '';
                return `<tr><td>${new Date(x.date).toLocaleString(L==='ko'?'ko-KR':L==='en'?'en-US':'es-MX')}</td><td>${esc(x.inspector||'—')}</td><td>${esc(x.program)}</td><td>${esc(x.part)}</td><td title="${esc(code)}">${esc(code.length>26?code.slice(0,26)+'…':code)}</td><td class="${x.ok?'yes':'no'}">${t(x.ok?'ok':'ng')}</td></tr>`
            }).join('') : '<tr><td colspan="6" style="text-align:center">—</td></tr>'
        }
        $('clear').onclick = () => {
            if (confirm(t('confirm'))) {
                localStorage.removeItem(K);
                render();
                $('result').className = 'result';
                if (sel()) setTimeout(() => $('qr').focus(), 50)
            }
        };
        async function stop() {
            scanning = false;
            if (stream) stream.getTracks().forEach(x => x.stop());
            stream = null;
            if ($('dlg').open) $('dlg').close()
        }
        $('close').onclick = stop;
        $('camera').onclick = async () => {
            if (!('BarcodeDetector' in window) || !navigator.mediaDevices?.getUserMedia) return alert(t('nocam'));
            try {
                let d = new BarcodeDetector({
                    formats: ['qr_code']
                });
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: {
                            ideal: 'environment'
                        }
                    }
                });
                $('video').srcObject = stream;
                await $('video').play();
                $('dlg').showModal();
                scanning = true;
                (async function scan() {
                    if (!scanning) return;
                    try {
                        let c = await d.detect($('video'));
                        if (c.length) {
                            $('qr').value = c[0].rawValue;
                            await stop();
                            verify();
                            return
                        }
                    } catch {}
                    requestAnimationFrame(scan)
                })()
            } catch {
                alert(t('nocam'));
                stop()
            }
        };
        // Blindaje contra escáneres físicos: si el escáner llega a "escribir" un
        // código mientras el foco quedó por accidente en el <select> de programa
        // (por ejemplo, tras un clic accidental), reconstruimos el código carácter
        // por carácter directo en el campo QR y movemos el foco ahí — sin afectar
        // nunca la selección manual con mouse/touch del programa, que sigue
        // funcionando exactamente igual que antes.
        $('program').addEventListener('keydown', e => {
            if (!currentUser || $('scanCard').hidden) return;
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            if (e.key === 'Enter') {
                e.preventDefault();
                $('qr').focus();
                verify();
                return
            }
            if (e.key.length === 1) {
                e.preventDefault();
                $('qr').value += e.key;
                $('qr').focus()
            }
        });
        setLang('es');
        restoreSession().then(restored => {
            if (!restored) $('accessPin').focus()
        });
    </script>
    <style>
        .access-card {
            max-width: 520px;
            margin-left: auto;
            margin-right: auto
        }

        .full {
            width: 100%;
            margin-top: 12px
        }

        .link-btn {
            border: 0;
            background: transparent;
            color: #1769aa;
            font-weight: 700;
            cursor: pointer;
            padding: 10px
        }

        .access-card .link-btn {
            width: 100%
        }

        .access-msg {
            min-height: 18px;
            text-align: center;
            color: #c62828;
            font-weight: 700
        }

        .session-line {
            display: flex;
            align-items: center;
            justify-content: space-between
        }

        .admin-body {
            padding: 18px
        }

        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr auto;
            gap: 8px
        }

        .user-list {
            margin-top: 14px;
            max-height: 320px;
            overflow: auto
        }

        .user-row {
            display: grid;
            grid-template-columns: 80px 1fr auto;
            gap: 8px;
            align-items: center;
            padding: 9px;
            border-bottom: 1px solid #e2e8f0
        }

        .cloud-note {
            font-size: 11px;
            color: #64748b
        }

        .cloud-ok {
            color: #168447
        }

        .cloud-off {
            color: #c62828
        }

        @media(max-width:650px) {
            .admin-grid {
                grid-template-columns: 1fr
            }

            .session-line {
                align-items: flex-start;
                gap: 8px
            }
        }

        .brand {
            gap: 14px
        }

        .logo {
            width: 145px;
            height: 52px;
            border-radius: 7px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px
        }

        .logo img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain
        }
    </style>
</body>
